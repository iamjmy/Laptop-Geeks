<!doctype html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Sell Property</title><link rel='stylesheet' href='style.css'></head><body><header class='header'><div class='container nav'><a href='index.html'><strong>DumagueteHomes</strong></a></div></header><main class='container section'><h1>Sell Property</h1><div class='form-steps'><span class='step-pill'>Step 1: Property</span><span class='step-pill'>Step 2: Price</span><span class='step-pill'>Step 3: Details</span><span class='step-pill'>Step 4: Photos</span><span class='step-pill'>Step 5: Contact</span></div><div class='panel'><h3>1) Property Identification</h3><select><option>House & Lot</option><option>Lot Only</option><option>Condo</option><option>Apartment</option></select><select><option>City/Municipality</option></select><select><option>Barangay</option></select></div><div class='panel'><h3>2) Price Signal</h3><label><input type='radio' name='p'> Exact Price</label><input placeholder='₱ exact'><label><input type='radio' name='p'> Price Range</label><select><option>Below ₱1M</option><option>₱1M–₱3M</option><option>₱3M–₱5M</option><option>₱5M+</option></select><label><input type='checkbox'> I’m not sure</label></div><div class='panel'><h3>3) Basic Property Details</h3><select><option>Lot Area Range</option></select><select><option>Floor Area Range</option></select><select><option>Bedrooms</option></select><select><option>Bathrooms</option></select></div><div class='panel'><h3>4) Property Condition</h3><select><option>New</option><option>Good</option><option>Needs renovation</option><option>Old</option></select><select><option>Fully furnished</option><option>Semi-furnished</option><option>Bare</option></select><label><input type='checkbox'> Bed</label><label><input type='checkbox'> Sofa</label><label><input type='checkbox'> Dining table</label><label><input type='checkbox'> Appliances</label><label><input type='checkbox'> TV</label><label><input type='checkbox'> Others</label><select><option>Parking</option><option>None</option><option>1</option><option>2</option><option>3+</option></select></div><div class='panel'><h3>5) Photos</h3><input type='file' multiple></div><div class='panel'><h3>6) Seller Context</h3><label><input type='checkbox'> Moving</label><label><input type='checkbox'> Need cash</label><label><input type='checkbox'> Upgrade</label><label><input type='checkbox'> Other</label><select><option>Urgent</option><option>1–3 months</option><option>No rush</option></select></div><div class='panel'><h3>7) What matters most?</h3><label><input type='checkbox'> Sell fast</label><label><input type='checkbox'> Highest price</label><label><input type='checkbox'> Lower commission</label><label><input type='checkbox'> Full service</label><label><input type='checkbox'> Strong marketing</label></div><div class='panel'><h3>8) Commitment Check</h3><label><input type='checkbox'> I will select only ONE agent for this property</label><label><input type='checkbox'> I agree to allow the selected agent to visit the property</label></div><div class='panel'><h3>9) Contact Info</h3><input placeholder='Name'><input placeholder='Phone'><input placeholder='Email'><button class='btn'>Submit</button></div></main></body></html>
