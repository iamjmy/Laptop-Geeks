<!DOCTYPE html>

<html lang="en">

<head> 
    <title>LaptopGeeks</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" type="x-icon" href="LaptopGeeksIcon.png">
    <link rel="stylesheet" href= "https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    
</head>
<body>
    <div class="cont">
        <img src="Img/Loginbg.png" alt="">

        <div>
            <img src="Img/Logo.png" class="loginlogo" alt=""></a> 
        </div> 

        <div class="loginbox">
            <h6>Log In</h6>
                <form  class="login" method="post" name="form" onsubmit="return validated()">
                    <p>Username</p>
                    <input autocomplete="off" class="text" name="username" placeholder="Enter Username">
                    <div id="username_error">
                        Please fill up your Username
                    </div>

                    <p>Password</p>
                    <input type="password" name="password" placeholder="Enter Password">
                    <div id="password_error">
                        Please fill up your Password
                    </div>

                    <button type="submit" class="submit" onclick="validated(this.form)"> Log In </button>

                </form>
            <h5>Forgot Password</h5>
        </div>
    </div>

    <script src = "account.js"> </script>
</body>


</html>
